name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Compile
        run: javac -encoding UTF-8 -d build/classes src/com/hdsl/Launcher.java

      - name: Compile tests
        run: javac -encoding UTF-8 -cp build/classes -d build/test-classes test/com/hdsl/*.java

      - name: Create jar
        run: jar --create --file build/hdsl-client.jar --main-class com.hdsl.Launcher -C build/classes .

      - name: Sidebar layout smoke test
        run: xvfb-run -a java -cp build/classes:build/test-classes com.hdsl.SidebarLayoutSmokeTest
